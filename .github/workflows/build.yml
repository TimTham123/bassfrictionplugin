name: Build and test

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    name: Windows x64 (MSVC)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Configure (Visual Studio, x64)
        run: cmake -S . -B build -A x64

      - name: Build (Release)
        run: cmake --build build --config Release --parallel

      - name: Core verification harness
        run: build\tests\Release\FrictionTests.exe --out build\test_output --renders build\renders --report build\TEST_REPORT_windows.md --allow-perf-fail

      - name: Plugin-level tests
        run: build\src\plugin\FrictionPluginTests_artefacts\Release\FrictionPluginTests.exe --out build\test_output --renders build\renders --append-report build\TEST_REPORT_windows.md

      - name: pluginval 1.0.4 (strictness 10)
        # bash waits for pluginval.exe (a GUI-subsystem program); PowerShell's call operator does not
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip
          7z x -y -opluginval pluginval.zip > /dev/null
          set +e
          ./pluginval/pluginval.exe --strictness-level 10 --skip-gui-tests --validate-in-process --output-dir build/pluginval \
            --validate build/src/plugin/Friction_artefacts/Release/VST3/Friction.vst3
          rc=$?
          set -e
          cat build/pluginval/*.txt 2>/dev/null || true
          echo "pluginval exit code: $rc"
          exit $rc

      - name: Upload plugin binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Friction-Windows-x64
          path: |
            build/src/plugin/Friction_artefacts/Release/VST3/
            build/src/plugin/Friction_artefacts/Release/Standalone/Friction.exe
          if-no-files-found: warn

      - name: Upload test report and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Friction-Windows-test-report
          path: |
            build/TEST_REPORT_windows.md
            build/renders/
            build/pluginval/
          if-no-files-found: warn

  linux:
    name: Linux x64 (GCC)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install JUCE dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libasound2-dev libx11-dev libxrandr-dev \
            libxinerama-dev libxcursor-dev libxcomposite-dev libxext-dev libfreetype-dev libfontconfig1-dev \
            libgl-dev fonts-dejavu-core

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Core verification harness
        run: ./build/tests/FrictionTests --out build/test_output --renders build/renders --report build/TEST_REPORT_linux.md --allow-perf-fail

      - name: Plugin-level tests
        run: ./build/src/plugin/FrictionPluginTests_artefacts/Release/FrictionPluginTests --out build/test_output --renders build/renders --append-report build/TEST_REPORT_linux.md

      - name: pluginval 1.0.4 (strictness 10)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Linux.zip
          unzip -q -o pluginval.zip -d pluginval
          # pluginval 1.0.4's Linux VST3 host can segfault in its own IRunLoop handling while tearing a
          # plug-in down (reproduced with a minimal JUCE plug-in; see TEST_REPORT.md). pluginval's
          # verdict decides: SUCCESS passes, FAILURE fails, and a crash before any verdict is retried once.
          for attempt in 1 2; do
            set +e
            ./pluginval/pluginval --strictness-level 10 --skip-gui-tests --validate-in-process --output-dir build/pluginval \
              --validate build/src/plugin/Friction_artefacts/Release/VST3/Friction.vst3 2>&1 | tee pluginval_$attempt.log
            rc=${PIPESTATUS[0]}
            set -e
            if grep -q "^FAILURE" pluginval_$attempt.log; then exit 1; fi
            if grep -q "^SUCCESS" pluginval_$attempt.log; then
              if [ "$rc" -ne 0 ]; then echo "::warning::pluginval exited with $rc after reporting SUCCESS (teardown crash in pluginval's host)"; fi
              exit 0
            fi
            echo "::warning::pluginval exited with $rc before reporting a verdict (attempt $attempt)"
          done
          exit 1

      - name: Upload artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Friction-Linux-x64
          path: |
            build/src/plugin/Friction_artefacts/Release/VST3/
            build/src/plugin/Friction_artefacts/Release/Standalone/Friction
            build/TEST_REPORT_linux.md
            build/pluginval/
          if-no-files-found: warn
